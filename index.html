<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="__RESUME_DESCRIPTION__" />
    <meta name="theme-color" content="#faf9f6" />
    <title>__RESUME_TITLE__</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="stylesheet" href="/src/style.css" />
    <script>
      try {
        const theme = localStorage.getItem('jb-theme');
        const size = Number(localStorage.getItem('jb-text-size') || 2);
        if (theme === 'dark' || (!theme && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.dataset.theme = 'dark';
        if (Number.isInteger(size) && size >= 0 && size <= 4) document.documentElement.style.setProperty('--text-scale', [0.875, 0.9375, 1, 1.0625, 1.125][size]);
      } catch {}
    </script>
  </head>
  <body id="top">
    <a class="skip-link" href="#main">Skip to résumé</a>
    <header class="toolbar">
      <div class="toolbar-inner">
        __RESUME_BRAND__
        <nav class="section-nav" aria-label="Résumé sections">
          __RESUME_NAVIGATION__
        </nav>
        <div class="toolbar-actions">
          <div class="text-controls" role="group" aria-label="Text size">
            <button id="decrease-text" class="text-button" aria-label="Decrease text size" title="Decrease text size">A−</button>
            <span class="size-dots" aria-hidden="true"><i></i><i></i><i class="active"></i><i></i><i></i></span>
            <button id="increase-text" class="text-button" aria-label="Increase text size" title="Increase text size">A+</button>
          </div>
          <a class="pdf-button" href="__RESUME_PDF__" download><svg class="icon" aria-hidden="true"><use href="#icon-download" /></svg><span>PDF</span></a>
          <button id="theme-toggle" class="icon-button" aria-label="Switch to dark theme" title="Switch to dark theme"><svg class="icon sun" aria-hidden="true"><use href="#icon-sun" /></svg><svg class="icon moon" aria-hidden="true"><use href="#icon-moon" /></svg></button>
        </div>
      </div>
    </header>

    <main id="main" class="resume" tabindex="-1">
      __RESUME_MAIN__
    </main>
    <p id="control-status" class="sr-only" role="status" aria-live="polite"></p>

    <svg xmlns="http://www.w3.org/2000/svg" class="svg-sprite" aria-hidden="true">
      <defs>
        <symbol id="icon-pin" viewBox="0 0 24 24"><path d="M20 10c0 6-8 11-8 11S4 16 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></symbol>
        <symbol id="icon-mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 6 9 7 9-7"/></symbol>
        <symbol id="icon-phone" viewBox="0 0 24 24"><path d="m8 3 3 5-3 3c1.5 2.5 2.5 3.5 5 5l3-3 5 3v3c0 2-2 2-3 2C10 20 4 14 3 6c0-1 0-3 2-3Z"/></symbol>
        <symbol id="icon-linkedin" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 10v7M12 17v-7m0 3a3 3 0 0 1 6 0v4"/><path d="M8 7h.01"/></symbol>
        <symbol id="icon-download" viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M4 15v5h16v-5"/></symbol>
        <symbol id="icon-external" viewBox="0 0 24 24"><path d="M14 3h7v7m0-7L10 14m0-10H4v16h16v-6"/></symbol>
        <symbol id="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></symbol>
        <symbol id="icon-moon" viewBox="0 0 24 24"><path d="M21 13a9 9 0 0 1-10-10A9 9 0 1 0 21 13Z"/></symbol>
        <symbol id="icon-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></symbol>
        <symbol id="icon-up" viewBox="0 0 24 24"><path d="M12 20V4m-6 6 6-6 6 6"/></symbol>
        <symbol id="icon-book" viewBox="0 0 24 24"><path d="M12 5v16M3 3c4-1 6 0 9 2 3-2 5-3 9-2v16c-4-1-6 0-9 2-3-2-5-3-9-2Z"/></symbol>
        <symbol id="icon-heart" viewBox="0 0 24 24"><path d="M20 5a5 5 0 0 0-8 1 5 5 0 0 0-8-1c-5 5 3 11 8 15 5-4 13-10 8-15Z"/></symbol>
        <symbol id="icon-users" viewBox="0 0 24 24"><circle cx="9" cy="7" r="3"/><path d="M3 21v-3a6 6 0 0 1 12 0v3m2-17a3 3 0 0 1 0 6m1 3a5 5 0 0 1 3 5v3"/></symbol>
      </defs>
    </svg>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
